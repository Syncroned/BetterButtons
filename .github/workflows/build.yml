name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

# releases bump and commit mod.json, so two of them must never run at once
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # the mod.json "gd" field decides what gets built: a plain string means
      # every platform, an object means exactly its keys (android = 32 + 64 bit)
      - id: detect
        shell: bash
        run: |
          if jq -e '.gd | type == "string"' mod.json > /dev/null 2>&1; then
            KEYS="win mac android ios"
          else
            KEYS=$(jq -r '.gd | keys[]' mod.json)
          fi

          out='{"include":[]}'
          for k in $KEYS; do
            case $k in
              win)
                out=$(jq -c '.include += [{"name":"Windows","os":"windows-latest","target":"Win64"}]' <<< "$out")
                ;;
              mac)
                out=$(jq -c '.include += [{"name":"macOS","os":"macos-latest","target":"MacOS"}]' <<< "$out")
                ;;
              android)
                out=$(jq -c '.include += [
                  {"name":"Android32","os":"ubuntu-latest","target":"Android32"},
                  {"name":"Android64","os":"ubuntu-latest","target":"Android64"}
                ]' <<< "$out")
                ;;
              ios)
                out=$(jq -c '.include += [{"name":"iOS","os":"macos-latest","target":"iOS"}]' <<< "$out")
                ;;
              *)
                echo "::warning::unknown gd platform key '$k', skipping"
                ;;
            esac
          done

          echo "$out" | jq .
          echo "matrix=$out" >> "$GITHUB_OUTPUT"

      # only pushes/dispatches on the default branch release; "[no release]"
      # in the head commit message opts out
      - id: release
        shell: bash
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${{ github.ref_name }}" == "${{ github.event.repository.default_branch }}" && "$COMMIT_MSG" != *"[no release]"* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # if the mod.json version is already released, bump the patch number and
      # commit it; a manually bumped (untagged) version is released as-is
      - id: version
        if: steps.release.outputs.release == 'true'
        shell: bash
        run: |
          VERSION=$(jq -r '.version' mod.json)
          VERSION=${VERSION#v}

          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::v$VERSION is already released and can't be auto-bumped; set a new version in mod.json"
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"

            # edit only the version line so the rest of mod.json keeps its formatting
            sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")v?[^\"]*\"/\1$VERSION\"/" mod.json
            [[ "$(jq -r '.version' mod.json)" == "$VERSION" ]] || { echo "::error::failed to bump mod.json"; exit 1; }

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Bump version to v$VERSION [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: prepare

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      # the runner's MSVC STL needs Clang 22+, and the action's own
      # `choco upgrade llvm` breaks whenever the Chocolatey feed is down, so
      # install LLVM straight from its GitHub release over the preinstalled one
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          LLVM_VERSION: "23.1.3"
        run: |
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          tar -xf llvm.tar.xz -C "C:/Program Files/LLVM" --strip-components=1
          rm llvm.tar.xz
          "C:/Program Files/LLVM/bin/clang.exe" --version

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['prepare', 'build']
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Create release
        if: needs.prepare.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "${{ steps.build.outputs.build-output }}"/*.geode \
            --repo "${{ github.repository }}" \
            --target "${{ needs.prepare.outputs.ref }}" \
            --title "v$VERSION" \
            --generate-notes
